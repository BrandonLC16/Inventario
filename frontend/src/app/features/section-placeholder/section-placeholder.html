<article class="section-card" [attr.data-section-id]="section.id">
  <p class="section-card__eyebrow">{{ section.eyebrow }}</p>
  <h1 tabindex="-1">{{ section.label }}</h1>
  <p class="section-card__description">{{ section.description }}</p>

  <div class="section-card__notice">
    <span aria-hidden="true">F2</span>
    <p>
      <strong>Área preparada.</strong>
      La funcionalidad del dominio se incorporará en su fase correspondiente.
    </p>
  </div>
</article>
