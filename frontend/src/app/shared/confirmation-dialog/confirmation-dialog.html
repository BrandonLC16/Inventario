<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false">
    {{ data.cancelLabel ?? 'Cancelar' }}
  </button>
  <button
    mat-flat-button
    type="button"
    [class.confirmation-dialog__danger]="data.destructive"
    [mat-dialog-close]="true"
    cdkFocusInitial
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
