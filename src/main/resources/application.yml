spring:
  application:
    name: inventory-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
    username: ${DB_USERNAME:inventory}
    password: ${DB_PASSWORD:inventory}
    hikari:
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:5000}
      connection-init-sql: >-
        SET lock_timeout TO '${DB_LOCK_TIMEOUT:5s}';
        SET statement_timeout TO '${DB_STATEMENT_TIMEOUT:30s}'
  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT:30s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html

server:
  error:
    include-message: never

inventory:
  security:
    jwt:
      issuer: ${JWT_ISSUER:inventory-api}
      audience: ${JWT_AUDIENCE:inventory-clients}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:14d}
    authentication-rate-limit:
      max-attempts-per-credential: ${AUTH_RATE_LIMIT_PER_CREDENTIAL:5}
      max-attempts-per-client: ${AUTH_RATE_LIMIT_PER_CLIENT:100}
      window: ${AUTH_RATE_LIMIT_WINDOW:1m}
      max-tracked-keys: ${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:10000}
      trusted-proxies: ${AUTH_TRUSTED_PROXIES:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    swagger-enabled: ${SWAGGER_ENABLED:false}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
